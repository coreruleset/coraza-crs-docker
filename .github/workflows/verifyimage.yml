---
name: Verify Images
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: "ghcr.io"
  REPO: "coreruleset/coraza-crs"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate matrix
        id: generate
        uses: docker/bake-action/subaction/matrix@018cb6412ab401ebaa809aa5f85966b74628600f # v7

  build:
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=moby/buildkit:master

      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: |
            ./docker-bake.hcl
          targets: ${{ matrix.target }}
          set: |
            *.platform=linux/amd64
            ${{ matrix.target }}.tags=${{ env.REGISTRY }}/${{ env.REPO }}:${{ matrix.target }}
          load: true
          push: false

      - name: Run functional tests (${{ matrix.target }})
        run: |
          ./tests/run-tests.sh \
            -v "${{ matrix.target }}" \
            -i "${{ env.REGISTRY }}/${{ env.REPO }}:${{ matrix.target }}"
